<style>
:root{
  /* Layout: a ledger-style desk. Thin office bar, three tabs, case list as ruled rows beside the open case file; actions run as a dated timeline; the client report moves through select, review, final. */
  --bg:#f1ede3; --surface:#fffdf8; --surface-2:#f6f1e6; --ink:#1a2236; --muted:#5b6071;
  --line:#ded5c2; --line-strong:#b6aa8f;
  --accent:#1c3d6b; --accent-ink:#ffffff; --accent-soft:#e2e9f4;
  --gold:#b08a3e; --gold-ink:#7a5a1c; --hdr:#101f38; --hdr-ink:#f4ecd6; --hdr-muted:#b9b9ae;
  --ok:#1b6e45; --ok-soft:#dcf0e5; --warn:#865000; --warn-soft:#fbebcf; --bad:#a8231b; --bad-soft:#fbe0dd;
  --backdrop:rgba(15,22,38,.5);
  --f-body:'Vazirmatn','Noto Naskh Arabic',Tahoma,system-ui,sans-serif;
  --f-display:'Markazi Text','Noto Naskh Arabic',Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120; --surface:#131c2f; --surface-2:#18233a; --ink:#e8ebf2; --muted:#9ca6ba;
    --line:#27334f; --line-strong:#43506c;
    --accent:#93b6ea; --accent-ink:#0a1428; --accent-soft:#1b2c4a;
    --gold:#d4b36a; --gold-ink:#e2c88a; --hdr:#081020; --hdr-ink:#f1e8cf; --hdr-muted:#a9aca6;
    --ok:#6fd4a0; --ok-soft:#14301f; --warn:#f0b866; --warn-soft:#38280d; --bad:#ff9b92; --bad-soft:#3a1816;
    --backdrop:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#131c2f; --surface-2:#18233a; --ink:#e8ebf2; --muted:#9ca6ba;
  --line:#27334f; --line-strong:#43506c;
  --accent:#93b6ea; --accent-ink:#0a1428; --accent-soft:#1b2c4a;
  --gold:#d4b36a; --gold-ink:#e2c88a; --hdr:#081020; --hdr-ink:#f1e8cf; --hdr-muted:#a9aca6;
  --ok:#6fd4a0; --ok-soft:#14301f; --warn:#f0b866; --warn-soft:#38280d; --bad:#ff9b92; --bad-soft:#3a1816;
  --backdrop:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.85;direction:rtl}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
bdi.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 4px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);line-height:1.4}
.top h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.25}
.today{font-size:13px;color:var(--muted)}
.today b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 8px;cursor:pointer;color:var(--muted);font-weight:500;min-height:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.notice{margin-top:14px;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:8px 12px;display:block}
.notice + .notice{margin-top:8px}
.notice.inst{color:var(--ink);background:var(--accent-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.inst>span{flex:1 1 220px}
main{padding-block:16px 28px}

/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 16px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:2px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn[disabled]:hover{border-color:var(--line-strong);color:inherit}
.btn.primary[disabled]:hover{color:var(--accent-ink);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.field .req{color:var(--bad)}
.in{width:100%;min-height:42px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink)}
textarea.in{min-height:76px;resize:vertical;line-height:1.8}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.in[aria-invalid="true"]{border-color:var(--bad)}
.in.date{direction:ltr;text-align:right}
.err{font-size:12.5px;color:var(--bad);line-height:1.5}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.row{display:flex;gap:8px;align-items:stretch}
.row > .in{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;padding:1px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.info{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:1px 10px;border-radius:99px;border:1px solid var(--line-strong);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-act{color:var(--accent)} .s-wait{color:var(--warn)} .s-done{color:var(--muted)}
.pill{color:inherit}
.pill.s-act{color:var(--accent)} .pill.s-wait{color:var(--warn)} .pill.s-done{color:var(--muted)}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.4}

/* digest */
.alertbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.digest{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.digest > header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.digest li{border-bottom:1px solid var(--line)}
.digest li:last-child{border-bottom:0}
.dg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:8px 14px;cursor:pointer}
.dg:hover{background:var(--surface-2)}
.dg .t{font-weight:500;overflow-wrap:anywhere}
.dg .m{grid-column:2;font-size:12.5px;color:var(--muted);line-height:1.5}
.dg .chip{justify-self:start}

/* split layout */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.split .detail{display:none}
.split.has-sel .list-col{display:none}
.split.has-sel .detail{display:block}
@media (min-width:880px){
  .split{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
  .split .detail,.split.has-sel .detail{display:block}
  .split.has-sel .list-col{display:block}
  .back{display:none!important}
}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar .in{flex:1;min-width:160px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.crow{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer}
.list li:last-child .crow{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow[aria-current="true"]{background:var(--accent-soft)}
.crow .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.crow .id{font-size:12.5px;color:var(--muted)}
.crow .cl{font-weight:700;overflow-wrap:anywhere}
.crow .sb{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.crow .au{font-size:12.5px;color:var(--muted)}
.crow .l3{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}

/* case file */
.file{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.file-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.file-head .top-line{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.file-head h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.35;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.facts dt{font-size:12px;color:var(--muted);line-height:1.5}
.facts dd{overflow-wrap:anywhere}
.acts-head{padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.acts-tools{padding:10px 16px 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts-tools .in{flex:1;min-width:150px}
.timeline{padding:0 16px 8px}
.act{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.act-date{font-weight:700;line-height:1.5}
.act-date span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.act-desc{font-weight:500;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin-top:6px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{overflow-wrap:anywhere}
.act-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.next-box{margin-top:8px;padding:8px 12px;background:var(--surface-2);border-radius:var(--r);font-size:14px}
.next-box.over{background:var(--bad-soft)}
.next-box .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:520px){
  .act{grid-template-columns:minmax(0,1fr);gap:6px}
  .act-date{display:flex;gap:10px;align-items:baseline}
  .grid2{grid-template-columns:minmax(0,1fr)}
}

/* report */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:13.5px;color:var(--muted)}
.step i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:12px;border:1px solid var(--line)}
.step.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.step.on i{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step.done i{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel.narrow{max-width:640px}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ri{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ri.off{opacity:.55}
.ri header{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ri header b{font-size:15px}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;min-height:34px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.ri .meta{font-size:14px;display:flex;flex-direction:column;gap:2px}
.ri-list{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.gate{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
.doc{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:20px 22px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:2;font-size:15px}

footer{padding-block:4px 32px;font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* finance + backup */
.seg{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
.segb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 18px;min-height:38px;cursor:pointer;font-weight:500}
.segb:hover{border-color:var(--accent);color:var(--accent)}
.segb[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;padding:10px 16px}
.fl{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.fv{font-weight:700;font-size:18px;line-height:1.6;overflow-wrap:anywhere}
.fv small{font-weight:400;font-size:12px;color:var(--muted)}
.fv.rem{color:var(--warn)} .fv.zero{color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:0 16px}
.bar i{display:block;height:100%;background:var(--accent)}
.fin-sub{padding:2px 16px 0;font-size:13px;color:var(--muted)}
.fin-sep{border-top:1px solid var(--line);margin-top:10px}
.finrows{display:flex;flex-direction:column;gap:2px;font-size:14px}
.bk{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.bk h3{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.4}
.snap{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.snap:first-child{border-top:0}

/* calendar, office, letters */
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap}
.cal-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cal-nav .grow{flex:1;min-width:150px;font-weight:700}
.seg{display:inline-flex;gap:4px}
.encbox{margin:8px 0 10px;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:10px}
.encin{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tlf{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tlbtn .ic{vertical-align:-2px}.guide-ic{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--accent-soft);color:var(--accent);margin:0 auto 10px}.gdots{display:flex;justify-content:center;gap:6px;margin:10px 0}.gdots i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}.gdots i.on{background:var(--accent)}.gbody{text-align:center;min-height:150px}.gbody h3{margin:4px 0 6px}
.tlbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 10px;cursor:pointer}
.tlbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tln{list-style:none;margin:0 6px 0 0;padding:0 18px 0 0;border-right:2px solid var(--line)}
.tln li{position:relative;margin:0 0 8px}
.tln li.tlmh{margin:14px 0 6px;font-weight:700;color:var(--muted);font-size:13px}
.tln li.tlmh::before,.tln li.tlnow::before{display:none}
.tln li::before{content:"";position:absolute;right:-24px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tln li.fut::before{background:var(--surface);border-color:var(--accent)}
.tlnow{text-align:center;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 10px;margin:8px 0 10px!important}
.tlb2{font:inherit;color:inherit;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tli.fut .tlb2{border-style:dashed}
.tld{display:flex;flex-direction:column;min-width:88px;font-size:12px;color:var(--muted)}
.tlt{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}.tlt .sub{font-size:12.5px;color:var(--muted)}
.fsopts{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;direction:rtl;margin-bottom:12px}
.mh{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.mc{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:68px;padding:5px 7px;text-align:start;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.mc.out{visibility:hidden;cursor:default}
.mc b{font-size:14px}.mc.hol b{color:var(--bad)}
.mc.istoday{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mc.sel{background:var(--accent-soft)}
.mc .dts{display:flex;flex-wrap:wrap;gap:3px}
.dt{font-style:normal;font-size:11px;line-height:18px;padding:0 6px;border-radius:999px;white-space:nowrap}

.emb{width:34px;height:34px;color:var(--accent)}
.today{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.tdate{height:36px;font-size:13px;color:var(--muted)}
.hbtn{height:38px;min-width:38px;justify-content:center;border-radius:12px;padding:0 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.hbtn.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

.tabs{display:flex;gap:2px;border-top:0;padding-bottom:0}
.tab{background:transparent!important;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;min-height:44px;color:var(--muted);font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:transparent!important}
.btn{border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.in,select.in,textarea.in{border-radius:12px;background:var(--surface);border-color:var(--line-strong)}
.in:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));border:0;border-radius:20px;color:#fff;box-shadow:var(--shadow)}
.hero h2,.hero p,.hero small,.hero .moti{color:#fff!important}
.hero .moti{opacity:.9}
.hero .quick .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.hero .quick .btn.primary{background:#fff;border-color:#fff;color:#2a3fa8}
.kpi,.msec,.start,.stat,.file,.list-col .list{border-radius:16px}
.kpi,.msec,.start,.stat{border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.todaybox{margin-bottom:16px}
.todaybox .msec{border-inline-start:4px solid var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;margin-block:10px}
.segb{border:0;background:transparent;color:var(--muted);border-radius:10px;padding:5px 12px;min-height:38px;font-weight:500}
.segb:hover{color:var(--ink);border:0}
.segb[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(20,26,46,.12);border:0}
dialog{border:0!important;border-radius:20px!important;box-shadow:0 24px 70px rgba(10,16,32,.35);border-top:0}
details.more{border:1px dashed var(--line-strong)!important;border-radius:12px!important;padding:8px 12px!important}
details.more>summary{cursor:pointer;color:var(--accent);font-weight:500;min-height:32px;display:flex;align-items:center}
details.more[open]>summary{margin-bottom:10px}
footer{justify-content:center;text-align:center;gap:10px 18px;color:var(--muted)}
.vmenu{position:fixed;top:60px;left:12px;width:min(310px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 48px rgba(10,16,32,.28);padding:6px;z-index:60;max-height:calc(100dvh - 80px);overflow:auto}
.mit{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:none;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:14px;min-height:44px}
.mit:hover{background:var(--surface-2)}
.mit .ic{color:var(--muted);flex:none}
.mit small{margin-inline-start:auto;color:var(--muted);font-size:12px}
.mit .upd-new{color:var(--accent);font-weight:700}
.msep{height:1px;background:var(--line);margin:6px 4px}
.mit.mob{display:none}
.fabw{position:fixed;left:20px;bottom:24px;z-index:35;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.fab{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 20px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 24px rgba(53,85,214,.35);cursor:pointer}
.fabm{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 48px rgba(10,16,32,.28);padding:6px;min-width:200px}
@keyframes vzpop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes vzfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.vmenu,.fabm,dialog[open]{animation:vzpop .18s ease}#view>*{animation:vzfade .22s ease}}
@media (pointer:coarse){.btn,.in,select.in{min-height:44px}.btn.sm{min-height:40px}.crow,.mrow{min-height:48px}}
@media (max-width:720px){
  .top h1{font-size:18px}.eyebrow{display:none}.tdate{display:none}
  .hbtn:not([data-act="menu-toggle"]) span:not(.bell-n){display:none!important}
    .hbtn{padding:0}
  .tabs{position:fixed;inset:auto 0 0 0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:0;overflow:visible;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(20,26,46,.08)}
  .tab{flex-direction:column;justify-content:center;gap:2px;font-size:11px;padding:8px 2px 6px;min-height:58px;border:0!important;position:relative}
  .tab .ic{width:22px;height:22px}
  .tab[aria-selected="true"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .mit.mob{display:flex}
  #app{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .fabw{bottom:calc(84px + env(safe-area-inset-bottom,0px));left:14px}
  .seg{flex-wrap:wrap}
  .segb{flex:1 1 auto;justify-content:center;white-space:nowrap;padding:4px 6px!important;font-size:12.5px;gap:3px}
  .segb svg{display:none}
  dialog{margin:auto 0 0!important;width:100%!important;max-width:100%!important;border-radius:22px 22px 0 0!important;max-height:92dvh}
}

.hero{display:block}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero .moti{font-size:18px;line-height:1.9;margin-top:6px}
.hero .moti small{font-size:15px}
.hero-today{background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 12px 6px;margin-top:16px}
.hero-today h3{font-size:15px;color:var(--muted);margin:0 4px 6px}
.hero-today .empty{padding:10px 4px 14px;color:var(--muted)}
.more-row{padding:8px 12px 12px;text-align:center}

/* ===== v1.17 polish ===== */
li.act.acc{display:block;padding:0;border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:14px;background:var(--surface);margin:10px 0;overflow:hidden;box-shadow:0 1px 2px rgba(20,26,46,.05);transition:box-shadow .15s,border-color .15s}
li.act.acc:hover{box-shadow:0 4px 14px rgba(20,26,46,.1)}
li.act.acc.open{border-color:var(--accent);box-shadow:0 6px 20px rgba(20,26,46,.12)}
.acc-h{display:flex;align-items:center;gap:14px;padding:12px 14px;cursor:pointer;background:var(--surface-2);user-select:none}
.acc-h:hover{background:var(--accent-soft)}
.acc-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.acc-h .act-date{display:flex;flex-direction:column;min-width:96px;flex:none}
.acc-h .act-desc{flex:1;min-width:0;margin:0}
.acc-t{display:inline-flex;align-items:center;gap:8px;margin-inline-start:auto;flex:none;color:var(--accent);font-size:12.5px;font-weight:500}
.acc-chev{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);transition:transform .2s,background .2s}
li.act.open .acc-chev{transform:rotate(180deg);background:var(--accent);color:var(--accent-ink)}
.acc-b{padding:12px 16px 14px;border-top:1px solid var(--line);display:none}

@media (max-width:600px){.acc-h{flex-wrap:wrap;gap:6px 10px}.acc-h .act-date{flex-direction:row;gap:8px;min-width:0}.acc-hint{display:none}}
.timeline>ul{padding:0}
.tools-open{margin-top:22px;padding:14px 4px 0;border-top:2px dashed var(--line-strong)}
.tools-open>.sec-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:17px}
/* buttons */
.btn{font-weight:500;letter-spacing:0;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .05s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tab:focus-visible,.hbtn:focus-visible,.segb:focus-visible,.mit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.primary:hover{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 45%,transparent);filter:none}
.btn.danger{background:var(--surface);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{border-radius:10px;padding:2px 12px}
.btn.sm .ic{flex:none}
.btn[disabled]{box-shadow:none}
.act-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.seg .btn.sm{border-color:transparent;background:transparent}
.seg .btn.sm.primary{background:var(--accent);color:var(--accent-ink)}
.chip{border-radius:99px;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.crow,.mrow,.kpi{transition:background-color .15s,box-shadow .15s,transform .1s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,26,46,.12)}
.mrow:hover,.crow:hover{background:var(--accent-soft)}
form .dlg-foot{position:sticky;bottom:-20px;margin:6px -20px -20px;padding:12px 20px 16px;background:var(--surface);border-top:1px solid var(--line);z-index:2}
.dlg h2{font-size:20px}
.acts-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hbtn[data-act="remind-open"]{position:relative;overflow:visible}
.bell-n{position:absolute;top:-6px;inset-inline-end:-6px;min-width:19px;height:19px;line-height:15px;padding:0 4px;border:2px solid var(--surface);border-radius:99px;font-size:10.5px;box-sizing:border-box}
/* ===== skin merged ===== */
.hero .nextcard{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.16);margin:14px 0 0;border-radius:18px;padding:14px 16px}
.hero .nextcard .btn.primary{background:#fcf3e3;color:#3d2b20}
/* ===== skin: navy and gold ===== */
:root{--bg:#f4f1e8;--surface:#fffdf8;--surface-2:#ebe7da;--ink:#13203a;--muted:#5c6579;--line:#e1dac6;--line-strong:#c6bc9f;--accent:#14284b;--accent-ink:#fffaf0;--accent-soft:#e3e8f3;--gold:#b8913f;--gold-ink:#86661e;--hdr:#fffdf8;--hdr-ink:#13203a;--hdr-muted:#5c6579;--ok:#17704a;--ok-soft:#dcefe3;--warn:#8a5a14;--warn-soft:#f6e6c8;--bad:#a8281f;--bad-soft:#f8dedb;--hero-a:#1d3866;--hero-b:#0d1c3b;--r:18px;--shadow:0 1px 2px rgba(16,30,60,.05),0 8px 24px rgba(16,30,60,.08);--backdrop:rgba(8,16,36,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1222;--surface:#121c33;--surface-2:#19253f;--ink:#eef1f7;--muted:#a3aec5;--line:#26345a;--line-strong:#3d4c74;--accent:#e4c57f;--accent-ink:#0a1222;--accent-soft:#1e2b4b;--gold:#d8b565;--gold-ink:#e6c985;--hdr:#121c33;--hdr-ink:#eef1f7;--hdr-muted:#a3aec5;--ok:#74d6a2;--ok-soft:#15301f;--warn:#f0bd70;--warn-soft:#3a2a10;--bad:#ff9d94;--bad-soft:#3b1a17;--hero-a:#1b3260;--hero-b:#0a1630;--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1222;--surface:#121c33;--surface-2:#19253f;--ink:#eef1f7;--muted:#a3aec5;--line:#26345a;--line-strong:#3d4c74;--accent:#e4c57f;--accent-ink:#0a1222;--accent-soft:#1e2b4b;--gold:#d8b565;--gold-ink:#e6c985;--hdr:#121c33;--hdr-ink:#eef1f7;--hdr-muted:#a3aec5;--ok:#74d6a2;--ok-soft:#15301f;--warn:#f0bd70;--warn-soft:#3a2a10;--bad:#ff9d94;--bad-soft:#3b1a17;--hero-a:#1b3260;--hero-b:#0a1630;--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
body{background:var(--bg)}

.hbtn.menu,.hbtn[data-act="menu-toggle"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hbtn:hover{border-color:var(--gold);color:var(--gold-ink)}
.hbtn[data-act="menu-toggle"]:hover{color:var(--accent-ink);filter:brightness(1.15)}
.bell-n{background:var(--bad);color:#fff}
.kpi,.msec,.start,.stat,.file,.panel,.list,.digest,.day,.ri,.hero-today,.list-col .list{border-radius:22px}
.kpi,.msec,.start,.stat,.file,.panel,.list,.digest,.day,.ri{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero{background:linear-gradient(145deg,var(--hero-a),var(--hero-b))!important;border-radius:26px;box-shadow:0 14px 34px rgba(10,22,50,.28)}
.hero .quick .btn.primary,.hero .btn.primary{background:#f8f0da;border-color:#f8f0da;color:#14284b}
.hero .quick .btn,.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#f8f0da}
.hero-today{background:var(--surface)}
.kpis{gap:10px}
.kpi{border-top:1px solid var(--line);border-radius:22px;padding:14px 16px}
.kpi:hover{border-color:var(--gold)}
.kpi b{font-family:var(--f-body);font-weight:800;color:var(--ink);font-size:clamp(17px,5vw,26px);overflow-wrap:anywhere}

.kpi>*:first-child:is(i,span.ic){background:var(--surface-2)!important;color:var(--gold-ink)!important}
.btn{border-radius:14px;background:var(--surface);border-color:var(--line-strong);color:var(--ink)}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.in,select.in,textarea.in{border-radius:14px;background:var(--surface);border-color:var(--line-strong)}
.seg{background:var(--surface-2);border-radius:99px;padding:4px}

dialog{background:var(--surface);color:var(--ink);border-radius:26px!important}
.vmenu,.fabm{border-radius:22px;background:var(--surface)}
details.more{border-color:var(--line-strong)!important}
details.more>summary{color:var(--gold-ink)}
a{color:var(--gold-ink)}
.notice{border-radius:18px}
.notice.inst{background:var(--accent-soft)}

‌ی یادآورها روی خود زنگ نشسته و دکمه‌ی شناور «افزودن» برداشته شد."],"1.18":["شمارنده‌ی یادآورها حالا یک نشان کوچک روی خود زنگ است و دیگر کنار آن جدا نمی‌نشیند.","دکمه‌ی شناور «افزودن» برداشته شد. ثبت اقدام، جلسه، مهلت و بقیه همچنان با دکمه‌ی بالای همان بخش پرونده انجام می‌شود.","از نسخه‌ی ۱٫۱۳ تا اینجا، مهم‌ترین تغییرها:","راهنمای شروع کار: برای اولین ورود خودکار باز می‌شود و همیشه از منوی بالا در دسترس است.","رابط تازه: ظاهر یکدست‌تر، حالت تاریک کامل‌تر و انتخاب ظاهر (روشن، تاریک یا خودکار) از منو.","دکمه‌ی «منو» در نوار بالا: راهنما، اندازه‌ی نوشته، ظاهر، قفل، حریم خصوصی، بروزرسانی و گزارش مشکل همه آنجا هستند. در گوشی شش تب اصلی، از جمله گزارش‌ها، در نوار پایین صفحه است.","کارت‌های کشویی: اقدام‌ها، جلسه‌ها، مهلت‌ها، ابلاغیه‌ها، اظهارنامه‌ها و مدارک هر پرونده با یک خط خلاصه دیده می‌شوند و با لمس باز می‌شوند. هر بخش نماد خودش را هم دارد.","ابلاغیه‌ها و اظهارنامه‌ها حالا امکان پیوست فایل دارند.","در ثبت جلسه، «دادگاه یا مرجع» و «شعبه» دو فیلد جدا شدند.","تقویم انتخاب تاریخ فقط با لمس خود فیلد باز می‌شود.","میز کار: «کارهای امروز» درون کارت اصلی آمد، «پیش‌رو» چهار مورد نشان می‌دهد و دکمه‌ی «نمایش بیشتر» دارد و متن انگیزشی بزرگ‌تر شد.","جست‌وجوی سراسری فرمان‌ها را هم می‌فهمد؛ مثلاً «جلسه‌ی جدید» بنویسید تا فرم آن باز شود.","ابزارهای محاسبه‌ی حق‌الوکاله و تمبر همیشه باز و در انتهای صفحه‌ی «مالی» است.","دکمه‌ها زیباتر و فرم‌ها کوتاه‌تر شدند و دکمه‌های ثبت و انصراف در فرم‌های بلند پایین پنجره می‌مانند."],"1.17":["اقدام‌ها، جلسه‌ها، مهلت‌ها، ابلاغیه‌ها، اظهارنامه‌ها و مدارک هر پرونده به‌صورت کارت‌های کشویی درآمدند: عنوان و تاریخ در یک خط دیده می‌شود و با لمس هر کارت جزئیات و دکمه‌ها باز می‌شود. با نماد فلش و برچسب «جزئیات» معلوم است کارت بازشدنی است.","ابزارهای محاسبه‌ی حق‌الوکاله و تمبر همیشه باز و در انتهای صفحه‌ی «مالی» است.","دکمه‌های برنامه زیباتر شدند: حالت روی‌دکمه‌رفتن و فشردن، نماد برای ویرایش، حذف و افزودن، دکمه‌ی اصلی برجسته‌تر و دکمه‌ی حذف قرمز ملایم. دکمه‌های ثبت و انصراف در فرم‌های بلند همیشه پایین پنجره می‌مانند.","ابلاغیه‌ها و اظهارنامه‌ها حالا امکان پیوست ود نسخه‌ی تازه‌تر، اطلاع می‌دهد.","پس از هر بروزرسانی، فهرست تازه‌های همان نسخه یک بار در پنجره‌ای نشان داده می‌شود.","صفحه‌ی «حریم خصوصی و امنیت» اضافه شد. این صفحه توضیح می‌دهد اطلاعات شما کجا نگهداری می‌شود، برنامه چه زمانی به اینترنت وصل می‌شود و رمزگذاری چه بخش‌هایی را در بر می‌گیرد.","پیوند GitHub و متن مجوز GPL-3.0 در بخش «درباره» قرار گرفت.","مشکل نصب‌نشدن برنامه در موبایل و رایانه برطرف شد."],"1.5":["نصب برنامه مانند یک اپلیکیشن، بررسی بروزرسانی از GitHub و صفحه‌ی «حریم خصوصی و امنیت» اضافه شد."],"1.4":["پیشنهاد نصب: هرگاه مرورگر اجازه بدهد، دکمه‌ی «نصب برنامه» نمایش داده می‌شود. برای آیفون نیز راهنمای نصب وجود دارد."],"1.3":["بررسی بروزرسانی: برنامه آخرین نسخه را از GitHub می‌خواند و در صورت وجود نسخه‌ی تازه‌تر، اطلاع می‌دهد.","پس از هر بروزرسانی، تازه‌های همان نسخه یک بار در پنجره‌ای نشان داده می‌شود.","پیوند GitHub و مجوز GPL-3.0 به بخش «درباره» افزوده شد.","مشکل نصب‌نشدن برنامه در موبایل و رایانه برطرف شد."],"1.2":["انتخاب تاریخ با تقویم کوچک در همه‌ی فیلدهای تاریخ، با یک کلیک.","نمایش نام تعطیلات در تقویم هفتگی.","افزودن پنجره‌های «درباره» و «گزارش مشکل».","رمزگذاری اختیاری اطلاعات با گذرواژه."],"1.12":["رمزگذاری فایل‌های پیوست: وقتی رمزگذاری اطلاعات روشن باشد، فایل‌های پیوست هم با همان گذرواژه رمز می‌شوند. فایل‌هایی که از قبل ثبت کرده‌اید هم هنگام روشن‌کردن رمزگذاری رمز می‌شوند.","رمزگذاری فایل پشتیبان: هنگام پشتیبان‌گیری می‌توانید فایل پشتیبان اصلی و پشتیبان فایل‌های پیوست را با یک گذرواژه‌ی جدا رمزگذاری کنید. بازگردانی هم با وارد کردن همان گذرواژه انجام می‌شود.","انتقال به دستگاه دیگر: همه‌ی پرونده‌ها و فایل‌های پیوست در یک بسته‌ی رمزگذاری‌شده قرار می‌گیرد تا آن را به دستگاه دیگر ببرید و بازگردانی کنید.","خط زمانی پرونده: اقدام‌ها، جلسه‌ها، مهلت‌ها، ابلاغیه‌ها، اظهارنامه‌ها، مدارک و ردیف‌های مالی هر پرونده به ترتیب تاریخ در یک نما دیده می‌شود. می‌توانید انواع را فیلتر کنید و ترتیب را عوض کنید.","اندازه‌ی نوشته: از دکمه‌ی «اندازه‌ی نوشته» (نماد A) در نوار بالای صفحه، اندازه‌ی متن و اجزای برنامه را بزرگ یا کوچک کنید.","قفل خودکار: اگر مدتی با برنامه ک یادآوری آن در برنامه، و تکمیل مشخصات نصب برنامه."],"2.6":["جمله‌ی انگیزشی میزکار در قابی تازه با نشان نقل‌قول و نام گوینده نمایش داده می‌شود و با دکمه‌ی «جمله‌ی بعدی» عوض می‌شود.","تعداد جمله‌ها از ۷ به ۳۶ رسید."],"2.7":["ساعت جلسه با تایپ پشت‌سرهم (مثلاً ۰۹۴۵) و درج خودکار «:» وارد می‌شود.","فیلد «موضوع جلسه» به جلسات رسیدگی افزوده شد.","کلیک بر «پرونده‌ها» همیشه به فهرست پرونده‌ها بازمی‌گرداند.","در مشخصات پرونده «شعبه» و «مرجع» حذف شد و با دکمه‌ی «+» می‌توان موضوعات بیشتری افزود.","مبالغ و اعداد با جداکننده‌ی هزارگان (کاما) نمایش داده و هنگام تایپ قالب‌بندی می‌شوند.","برچسب‌های میزکار: «جلسه تا ۷ روز آینده» و «مهلت قانونی».","نوار بخش‌های پرونده در موبایل دو ردیفه شد و آیکون اثر انگشت اصلاح شد."],"2.8":["چیدمان کارت‌های آماری میزکار و گزارش مالی مرتب‌تر شد (برچسب‌های چندخطی هم‌تراز).","اندازه‌ی لمسی نشان‌ها و پیوند پایین صفحه بزرگ‌تر شد.","فیلتر فهرست پرونده در نمای دسکتاپ تمام‌عرض شد."],"2.9":["مرجع و شعبه در نامه‌ها، گزارش و تقویم از آخرین جلسه‌ی پرونده برداشته می‌شود و با حذف این فیلدها از فرم پرونده خالی نمی‌ماند.","نشان اعلان در حالت تیره خواناتر شد و فهرست پرونده‌ی محاسبه‌ی هزینه برچسب دسترس‌پذیر گرفت."],"3.0":["طرح شیشه‌ای و نیمه‌شفاف، با کلید روشن/خاموش در «اندازه‌ی نوشته».","بانک قوانین: قانون اساسی، مدنی، تجارت، آیین دادرسی مدنی و کیفری و مجازات اسلامی، با جست‌وجو، نشان‌کردن و کپی با ارجاع."],"3.1":["امکان حذف حساب کاربری: «حذف حساب من» در پنجره‌ی حساب، با تأیید گذرواژه و نوشتن نام حساب."],"3.3":["نمایش نام کاربری حساب‌ها در آمار کاربران فعال (برای مدیر)، با کلید خاموش‌کردن در «حساب کاربری».","جدول نصب‌ها با نام کاربری‌ها، نسخه و تاریخ اولین و آخرین ورود در پنجره‌ی آمار."],"3.4":["محاسبه‌ی حق‌الوکاله‌ی چندمرحله‌ای: حق‌الوکاله‌ی کل، سهم مرحله‌ی نخستین و تجدیدنظر (و دادسرا در کیفری)، همراه مستندات.","دکمه‌های ارسال، کپی و چاپ برای نتیجه‌ی محاسبه؛ درصد هر مرحله قابل‌ویرایش است."],"3.5":["شمارنده‌ی کاربران فعال همیشه فعال است و کلید خاموش‌کردن آن برداشته شد.","مشاهده‌ی آمار کاربران فعال فقط برای مدیر نمایش داده می‌شود."],"3.6":["دکمه‌ی مشاهده‌ی آمار کاربران فعال پنهان شد؛ فقط با کلید مخصوص مدیر و رمز دسترسی باز می‌شود."],"3.7":["اتصال شمارنده‌ی کاربران فعال به سرویس آمار."],"3.8":["بازبینی و ایمن‌تر شدن سرویس آمار (محدودیت حجم درخواست و سقف تعداد نصب‌ها)."],"3.2":["شمارنده‌ی ناشناس کاربران فعال (روزی یک‌بار، فقط شناسه‌ی تصادفی و شماره‌ی نسخه)، با کلید خاموش‌کردن در «حساب کاربری».","نمایش آمار کاربران فعال همه‌ی نصب‌ها برای مدیر، با کلید مشاهده (پس از راه‌اندازی سرویس آمار روی هاست)."],"3.9":["آماده‌سازی نسخه‌ی اندروید: ذخیره‌ی پشتیبان و فایل چاپی در اندروید از طریق اشتراک‌گذاری فایل."],"4.9":["هماهنگ‌سازی چند بخش که هنوز با طرح شیشه‌ای تازه هم‌رنگ نشده بودند: نوار «پرونده‌های نمونه» و نوارهای راهنمای مشابه.","سربرگ خلوت‌تر شد: آیکون پشتیبان‌گیری از سربرگ برداشته شد (از «منو» در دسترس است)."],"4.8":["طرح رنگی تازه: پوسته‌ی سرمه‌ای و طلایی (شیشه‌ای) دقیقاً مطابق نمونه‌ای که تأیید شد، روی کل برنامه (داشبورد، پرونده‌ها، فرم‌ها، دیالوگ‌ها، صفحه‌ی ورود) اعمال شد."],"4.7":["در سربرگ برنامه، به‌جای یک نام ثابت، نام خودِ شما (همان نامی که هنگام ساخت حساب کاربری وارد کرده‌اید) نمایش داده می‌شود.","نوار پایین صفحه خلوت‌تر شد: بخش‌های «ابزارها»، «نامه‌ها»، «قوانین» و «گزارش‌ها» اکنون زیر یک دکمه‌ی «بیشتر» جمع شده‌اند تا تب‌های اصلی (داشبورد، پرونده‌ها، تقویم، مالی) راحت‌تر در دسترس باشند؛ همه‌ی بخش‌ها همچنان با همان عملکرد قبلی در دسترس‌اند.","افزودن محاسبه‌گر سهم‌الارث به بخش ابزارها: محاسبه‌ی سهم هر یک از وراث طبقه‌ی اول (فرزندان، پدر، مادر، همسر) بر پایه‌ی مواد ۸۶۲ تا ۹۱۵ قانون مدنی، با نتیجه به‌صورت کسر دقیق و قابل‌کپی."],"4.6":["رفع یک ایراد جدی که فقط در نسخه‌ی اندروید رخ می‌داد: صفحه‌ی میزکار بعد از ورود کاملاً خالی می‌ماند و آیکون‌های نوار پایین نمایش داده نمی‌شدند (فقط با کلیک روی نام تب‌ها کار می‌کردند). علت: یک فراخوانی به سامانه‌ی اندروید (برای اطلاع از فعال‌شدن دوباره‌ی برنامه) با فرمت پاسخ انتظاررفته هم‌خوانی نداشت و باعث توقف کل راه‌اندازی برنامه می‌شد؛ این بخش اکنون در برابر چنین خطاهایی ایمن شده است.","افزودن یک گزارش‌گر خطای راه‌اندازی: اگر در آینده مشکلی مشابه (فقط روی برخی گوشی‌ها) پیش بیاید، به‌جای خالی‌ماندن utton></div>')}const as={intro:"این صفحه به زبان ساده می‌گوید دستیار وکیل با اطلاعات شما چه می‌کند و چه نمی‌کند. به‌روزرسانی: نسخه‌ی ۲٫۶، آبان ۱۴۰۵.",s:[{t:"اطلاعات شما کجا نگهداری می‌شود",p:["همه‌ی اطلاعات پرونده‌ها، موکل‌ها، مهلت‌ها و پیوست‌ها فقط در حافظه‌ی مرورگرِ همین دستگاه ذخیره می‌شود. برنامه سرور ندارد، حساب آنلاین ندارد و چیزی را برای هیچ سرویسی نمی‌فرستد.","طراح برنامه هم به اطلاعات شما دسترسی ندارد و هیچ راهی برای دیدن آن‌ها ندارد."]},{t:"برنامه چه زمانی به اینترنت وصل می‌شود",l:["بارگذاری خود برنامه از سایت GitHub Pages، مثل باز کردن هر سایت دیگر.","بررسی بروزرسانی: فقط یک فایل کوچک به نام version.json خوانده می‌شود. هیچ اطلاعاتی از شما یا پرونده‌هایتان ارسال نمی‌شود. مثل هر سایتی، GitHub نشانی IP بازدیدکننده را در گزارش‌های فنی خودش می‌بیند.","فقط در نسخه‌ی اندروید: برای دانستن نسخه‌ی جدید، اطلاعات عمومی آخرین انتشار از GitHub خوانده می‌شود و فایل نصب فقط وقتی دانلود می‌شود که خودتان «دانلود و نصب» را بزنید. هیچ اطلاعاتی از شما ارسال نمی‌شود.","بارگذاری فونت وزیرمتن از Google Fonts: مرورگر شما برای گرفتن فونت به سرورهای گوگل وصل می‌شود و گوگل، مثل هر سایتی، نشانی IP و نوع مرورگر را می‌بیند. هیچ اطلاعاتی از پرونده‌های شما ارسال نمی‌شود.","ساخت فایل zip از فایل‌های پیوست (فقط وقتی پشتیبان فایل‌ها را بدون رمزگذاری می‌گیرید): کتابخانه‌ی JSZip از سرویس cdnjs گرفته می‌شود. اگر پشتیبان را رمزگذاری کنید، این کتابخانه لازم نیست. در این حالت هم چیزی از اطلاعات شما فرستاده نمی‌شود.","لینک‌های تلگرام، اینستاگرام و حمایت مالی فقط وقتی باز می‌شوند که خودتان روی آن‌ها بزنید."],p:["برنامه تحلیل بازدید، تبلیغات، ردیاب و کوکی ندارد. بعد از اولین باز شدن، برنامه بدون اینترنت هم کار می‌کند؛ فقط اگر فونت در مرورگر ذخیره نشده باشد، فونت پیش‌فرض دستگاه نمایش داده می‌شود."]},{t:"گذرواژه و حساب‌های کاربری",p:["می‌توان چند حساب روی یک دستگاه ساخت و داده‌ی هر حساب جداست. خود گذرواژه ذخیره نمی‌شود و فقط یک اثر انگشت یک‌طرفه‌ی آن (SHA-256 همراه با مقدار تصادفی) نگه داشته می‌شود.","نکته‌ی مهم: اگر «رمزگذاری داده‌ها» روشن نباشد، گذرواژه‌ی ورود فقط یک در است، نه قفل. کسی که به همین دستگاه و همین پروفایل مرورگر دسترسی کامل داشته باشد، با ابزارهای مرورگر می‌تواند داده‌ها را بخواند."]},{t:"رمزگذاری اختیاری",p:["با روشن کردن رمزگذاری، داده‌های حساب شما و فایل‌های پیوست با الگوریتم AES-256-GCM رمز می‌شود و کلید آن با روش PBKDF2 (۲۰۰٬۰۰۰ دور) از گذرواژه‌ی شما ساخته می‌شود. بدون گذرواژه، داده‌ی ذخیره‌شده خواندنی نیست."],l:["اگر گذرواژه را فراموش کنید، داده‌ها قابل بازیابی نیستند، حتی برای طراح برنامه.","پس از روشن کردن رمزگذاری، یک فایل پشتیبان تازه بگیرید.","فایل پشتیبان فقط وقتی رمزگذاری می‌شود که هنگام پشتیبان‌گیری گزینه‌ی رمزگذاری را بزنید و گذرواژه‌ای جدا بدهید. در حساب‌های رمزگذاری‌شده این گزینه از پیش روشن است. فایل رمزگذاری‌شده بدون آن گذرواژه باز نمی‌شود."]},{t:"ورود با اثر انگشت یا قفل دستگاه",p:["این امکان اختیاری است و برای هر دستگاه جدا روشن می‌شود. تأیید هویت را خود دستگاه انجام می‌دهد؛ اثر انگشت یا چهره‌ی شما هرگز به برنامه یا جایی فرستاده نمی‌شود.","در دستگاه‌هایی که پشتیبانی کنند، گذرواژه‌ی شما با کلیدی که فقط پس از تأیید هویت در دستگاه ساخته می‌شود، رمزگذاری و روی همین دستگاه نگه داشته می‌شود. با تغییر گذرواژه، این ورود خاموش می‌شود و باید دوباره روشن شود.","اگر دستگاه این قابلیت را نداشته باشد و داده‌ها رمزگذاری نشده باشند، ورود فقط محافظت می‌شود و این قفل جایگزین رمزگذاری داده‌ها نیست."]},{t:"پشتیبان‌گیری",p:["فایل پشتیبان روی دستگاه خودتان ذخیره می‌شود و جای دیگری فرستاده نمی‌شود. از آن لحظه به بعد، نگهداری آن با شماست. آن را در ایمیل، پیام‌رسان یا فضای ابری نگذارید مگر مطمئن باشید که دیگران به آن دسترسی ندارند."]},{t:"محافظ داده",p:["اگر هنگام باز کردن برنامه، داده‌ی ذخیره‌شده خوانده نشود یا پیدا نشود، برنامه به‌جای نمایش داده‌ی نمونه و بازنویسی داده‌ی شما، همه‌ی ذخیره‌ها را متوقف می‌کند و راه‌های بازیابی را نشان می‌دهد: نقطه‌ی بازگشت، فایل پشتیبان یا شروع از نو.","نقطه‌ی بازگشت خودکار هر روز، پس از اولین ذخیره‌ی داده‌ی واقعی ساخته می‌شود و فقط روی همین دستگاه می‌ماند."]},{t:"انتقال به دستگاه دیگر",p:["بسته‌ی انتقال همیشه با گذرواژه‌ای که خودتان می‌دهید رمزگذاری می‌شود. برنامه آن را جایی نمی‌فرستد؛ فایل را خودتان به دستگاه دیگر م
