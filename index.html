<style>
:root{
  /* Layout: a ledger-style desk. Thin office bar, three tabs, case list as ruled rows beside the open case file; actions run as a dated timeline; the client report moves through select, review, final. */
  --bg:#f1ede3; --surface:#fffdf8; --surface-2:#f6f1e6; --ink:#1a2236; --muted:#5b6071;
  --line:#ded5c2; --line-strong:#b6aa8f;
  --accent:#1c3d6b; --accent-ink:#ffffff; --accent-soft:#e2e9f4;
  --gold:#b08a3e; --gold-ink:#7a5a1c; --hdr:#101f38; --hdr-ink:#f4ecd6; --hdr-muted:#b9b9ae;
  --ok:#1b6e45; --ok-soft:#dcf0e5; --warn:#865000; --warn-soft:#fbebcf; --bad:#a8231b; --bad-soft:#fbe0dd;
  --backdrop:rgba(15,22,38,.5);
  --f-body:'Vazirmatn','Noto Naskh Arabic',Tahoma,system-ui,sans-serif;
  --f-display:'Markazi Text','Noto Naskh Arabic',Georgia,serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1120; --surface:#131c2f; --surface-2:#18233a; --ink:#e8ebf2; --muted:#9ca6ba;
    --line:#27334f; --line-strong:#43506c;
    --accent:#93b6ea; --accent-ink:#0a1428; --accent-soft:#1b2c4a;
    --gold:#d4b36a; --gold-ink:#e2c88a; --hdr:#081020; --hdr-ink:#f1e8cf; --hdr-muted:#a9aca6;
    --ok:#6fd4a0; --ok-soft:#14301f; --warn:#f0b866; --warn-soft:#38280d; --bad:#ff9b92; --bad-soft:#3a1816;
    --backdrop:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#131c2f; --surface-2:#18233a; --ink:#e8ebf2; --muted:#9ca6ba;
  --line:#27334f; --line-strong:#43506c;
  --accent:#93b6ea; --accent-ink:#0a1428; --accent-soft:#1b2c4a;
  --gold:#d4b36a; --gold-ink:#e2c88a; --hdr:#081020; --hdr-ink:#f1e8cf; --hdr-muted:#a9aca6;
  --ok:#6fd4a0; --ok-soft:#14301f; --warn:#f0b866; --warn-soft:#38280d; --bad:#ff9b92; --bad-soft:#3a1816;
  --backdrop:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.85;direction:rtl}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
bdi.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:16px 4px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);line-height:1.4}
.top h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.25}
.today{font-size:13px;color:var(--muted)}
.today b{color:var(--ink);font-weight:500}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px 8px;cursor:pointer;color:var(--muted);font-weight:500;min-height:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.notice{margin-top:14px;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:8px 12px;display:block}
.notice + .notice{margin-top:8px}
.notice.inst{color:var(--ink);background:var(--accent-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.inst>span{flex:1 1 220px}
main{padding-block:16px 28px}

/* shared controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 16px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:2px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn[disabled]:hover{border-color:var(--line-strong);color:inherit}
.btn.primary[disabled]:hover{color:var(--accent-ink);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.field .req{color:var(--bad)}
.in{width:100%;min-height:42px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink)}
textarea.in{min-height:76px;resize:vertical;line-height:1.8}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.in[aria-invalid="true"]{border-color:var(--bad)}
.in.date{direction:ltr;text-align:right}
.err{font-size:12.5px;color:var(--bad);line-height:1.5}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}
.row{display:flex;gap:8px;align-items:stretch}
.row > .in{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.5;padding:1px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.info{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:1px 10px;border-radius:99px;border:1px solid var(--line-strong);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-act{color:var(--accent)} .s-wait{color:var(--warn)} .s-done{color:var(--muted)}
.pill{color:inherit}
.pill.s-act{color:var(--accent)} .pill.s-wait{color:var(--warn)} .pill.s-done{color:var(--muted)}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.4}

/* digest */
.alertbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.digest{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.digest > header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.digest li{border-bottom:1px solid var(--line)}
.digest li:last-child{border-bottom:0}
.dg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:8px 14px;cursor:pointer}
.dg:hover{background:var(--surface-2)}
.dg .t{font-weight:500;overflow-wrap:anywhere}
.dg .m{grid-column:2;font-size:12.5px;color:var(--muted);line-height:1.5}
.dg .chip{justify-self:start}

/* split layout */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.split .detail{display:none}
.split.has-sel .list-col{display:none}
.split.has-sel .detail{display:block}
@media (min-width:880px){
  .split{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
  .split .detail,.split.has-sel .detail{display:block}
  .split.has-sel .list-col{display:block}
  .back{display:none!important}
}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar .in{flex:1;min-width:160px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.crow{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer}
.list li:last-child .crow{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow[aria-current="true"]{background:var(--accent-soft)}
.crow .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.crow .id{font-size:12.5px;color:var(--muted)}
.crow .cl{font-weight:700;overflow-wrap:anywhere}
.crow .sb{font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.crow .au{font-size:12.5px;color:var(--muted)}
.crow .l3{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}

/* case file */
.file{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.file-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.file-head .top-line{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.file-head h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.35;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.facts dt{font-size:12px;color:var(--muted);line-height:1.5}
.facts dd{overflow-wrap:anywhere}
.acts-head{padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.acts-tools{padding:10px 16px 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts-tools .in{flex:1;min-width:150px}
.timeline{padding:0 16px 8px}
.act{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.act-date{font-weight:700;line-height:1.5}
.act-date span{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.act-desc{font-weight:500;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin-top:6px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{overflow-wrap:anywhere}
.act-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.next-box{margin-top:8px;padding:8px 12px;background:var(--surface-2);border-radius:var(--r);font-size:14px}
.next-box.over{background:var(--bad-soft)}
.next-box .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:520px){
  .act{grid-template-columns:minmax(0,1fr);gap:6px}
  .act-date{display:flex;gap:10px;align-items:baseline}
  .grid2{grid-template-columns:minmax(0,1fr)}
}

/* report */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:13.5px;color:var(--muted)}
.step i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:12px;border:1px solid var(--line)}
.step.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.step.on i{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step.done i{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.panel.narrow{max-width:640px}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ri{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ri.off{opacity:.55}
.ri header{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ri header b{font-size:15px}
.chk{display:inline-flex;gap:8px;align-items:center;cursor:pointer;min-height:34px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.ri .meta{font-size:14px;display:flex;flex-direction:column;gap:2px}
.ri-list{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.gate{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}
.doc{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:20px 22px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:2;font-size:15px}

footer{padding-block:4px 32px;font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

/* finance + backup */
.seg{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap}
.segb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:4px 18px;min-height:38px;cursor:pointer;font-weight:500}
.segb:hover{border-color:var(--accent);color:var(--accent)}
.segb[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;padding:10px 16px}
.fl{display:block;font-size:12px;color:var(--muted);line-height:1.5}
.fv{font-weight:700;font-size:18px;line-height:1.6;overflow-wrap:anywhere}
.fv small{font-weight:400;font-size:12px;color:var(--muted)}
.fv.rem{color:var(--warn)} .fv.zero{color:var(--ok)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:0 16px}
.bar i{display:block;height:100%;background:var(--accent)}
.fin-sub{padding:2px 16px 0;font-size:13px;color:var(--muted)}
.fin-sep{border-top:1px solid var(--line);margin-top:10px}
.finrows{display:flex;flex-direction:column;gap:2px;font-size:14px}
.bk{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.bk h3{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.4}
.snap{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.snap:first-child{border-top:0}

/* calendar, office, letters */
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap}
.cal-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cal-nav .grow{flex:1;min-width:150px;font-weight:700}
.seg{display:inline-flex;gap:4px}
.encbox{margin:8px 0 10px;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:10px}
.encin{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tlf{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tlbtn .ic{vertical-align:-2px}.guide-ic{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:var(--accent-soft);color:var(--accent);margin:0 auto 10px}.gdots{display:flex;justify-content:center;gap:6px;margin:10px 0}.gdots i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}.gdots i.on{background:var(--accent)}.gbody{text-align:center;min-height:150px}.gbody h3{margin:4px 0 6px}
.tlbtn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 10px;cursor:pointer}
.tlbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tln{list-style:none;margin:0 6px 0 0;padding:0 18px 0 0;border-right:2px solid var(--line)}
.tln li{position:relative;margin:0 0 8px}
.tln li.tlmh{margin:14px 0 6px;font-weight:700;color:var(--muted);font-size:13px}
.tln li.tlmh::before,.tln li.tlnow::before{display:none}
.tln li::before{content:"";position:absolute;right:-24px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tln li.fut::before{background:var(--surface);border-color:var(--accent)}
.tlnow{text-align:center;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 10px;margin:8px 0 10px!important}
.tlb2{font:inherit;color:inherit;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tli.fut .tlb2{border-style:dashed}
.tld{display:flex;flex-direction:column;min-width:88px;font-size:12px;color:var(--muted)}
.tlt{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}.tlt .sub{font-size:12.5px;color:var(--muted)}
.fsopts{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;direction:rtl;margin-bottom:12px}
.mh{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.mc{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:68px;padding:5px 7px;text-align:start;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.mc.out{visibility:hidden;cursor:default}
.mc b{font-size:14px}.mc.hol b{color:var(--bad)}
.mc.istoday{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mc.sel{background:var(--accent-soft)}
.mc .dts{display:flex;flex-wrap:wrap;gap:3px}
.dt{font-style:normal;font-size:11px;line-height:18px;padding:0 6px;border-radius:999px;white-space:nowrap}
.dt.h{background:var(--accent-soft);color:var(--accent)}.dt.d{background:var(--warn-soft);color:var(--warn)}.dt.o{background:var(--surface-2);color:var(--muted)}.dt.bad{background:var(--bad-soft);color:var(--bad)}
@media(max-width:600px){.mgrid{gap:3px}.mc{min-height:54px;padding:3px 4px;border-radius:8px}.mc b{font-size:12px}.dt{font-size:10px;padding:0 4px;line-height:16px}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}

:root{--bg:#f4f1e8;--surface:#fffdf8;--surface-2:#ebe7da;--ink:#13203a;--muted:#5c6579;--line:#e1dac6;--line-strong:#c6bc9f;--accent:#14284b;--accent-ink:#fffaf0;--accent-soft:#e3e8f3;--gold:#b8913f;--gold-ink:#86661e;--hdr:#fffdf8;--hdr-ink:#13203a;--hdr-muted:#5c6579;--ok:#17704a;--ok-soft:#dcefe3;--warn:#8a5a14;--warn-soft:#f6e6c8;--bad:#a8281f;--bad-soft:#f8dedb;--hero-a:#1d3866;--hero-b:#0d1c3b;--r:18px;--shadow:0 1px 2px rgba(16,30,60,.05),0 8px 24px rgba(16,30,60,.08);--backdrop:rgba(8,16,36,.55)}

:root[data-theme="dark"]{--bg:#0a1222;--surface:#121c33;--surface-2:#19253f;--ink:#eef1f7;--muted:#a3aec5;--line:#26345a;--line-strong:#3d4c74;--accent:#e4c57f;--accent-ink:#0a1222;--accent-soft:#1e2b4b;--gold:#d8b565;--gold-ink:#e6c985;--hdr:#121c33;--hdr-ink:#eef1f7;--hdr-muted:#a3aec5;--ok:#74d6a2;--ok-soft:#15301f;--warn:#f0bd70;--warn-soft:#3a2a10;--bad:#ff9d94;--bad-soft:#3b1a17;--hero-a:#1b3260;--hero-b:#0a1630;--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}

,"دکمه‌ی خروجی تقویم در صفحه‌ی تقویم، منوی بالا، جست‌وجوی فرمان‌ها و بخش «جلسات» هر پرونده هست."],"1.19":["رابط تازه با ظاهر یکدست، حالت تاریک کامل‌تر و دکمه‌ی «منو» در نوار بالا؛ در گوشی تب‌های اصلی در نوار پایین صفحه است.","اقدام‌ها، جلسه‌ها، مهلت‌ها و بقیه‌ی موارد هر پرونده به‌صورت کارت‌های کشویی نمایش داده می‌شوند.","ابلاغیه‌ها و اظهارنامه‌ها امکان پیوست فایل دارند و در ثبت جلسه، دادگاه و شعبه جدا شدند.","میز کار ساده‌تر شد: کارهای امروز در کارت اصلی است و «پیش‌رو» چهار مورد نشان می‌دهد.","راهنمای شروع کار برای کاربر تازه اضافه شد.","شمارنده‌ی یادآورها روی خود زنگ نشسته و دکمه‌ی شناور «افزودن» برداشته شد."],"1.18":["شمارنده‌ی یادآورها حالا یک نشان کوچک روی خود زنگ است و دیگر کنار آن جدا نمی‌نشیند.","دکمه‌ی شناور «افزودن» برداشته شد. ثبت اقدام، جلسه، مهلت و بقیه همچنان با دکمه‌ی بالای همان بخش پرونده انجام می‌شود.","از نسخه‌ی ۱٫۱۳ تا اینجا، مهم‌ترین تغییرها:","راهنمای شروع کار: برای اولین ورود خودکار باز می‌شود و همیشه از منوی بالا در دسترس است.","رابط تازه: ظاهر یکدست‌تر، حالت تاریک کامل‌تر و انتخاب ظاهر (روشن، تاریک یا خودکار) از منو.","دکمه‌ی «منو» در نوار بالا: راهنما، اندازه‌ی نوشته، ظاهر، قفل، حریم خصوصی، بروزرسانی و گزارش مشکل همه آنجا هستند. در گوشی شش تب اصلی، از جمله گزارش‌ها، در نوار پایین صفحه است.","کارت‌های کشویی: اقدام‌ها، جلسه‌ها، مهلت‌ها، ابلاغیه‌ها، اظهارنامه‌ها و مدارک هر پرونده با یک خط خلاصه دیده می‌شوند و با لمس باز می‌شوند. هر بخش نماد خودش را هم دارد.","ابلاغیه‌ها و اظهارنامه‌ها حالا امکان پیوست فایل دارند.","در ثبت جلسه، «دادگاه یا مرجع» و «شعبه» دو فیلد جدا شدند.","تقویم انتخاب تاریخ فقط با لمس خود فیلد باز می‌شود.","میز کار: «کارهای امروز» درون کارت اصلی آمد، «پیش‌رو» چهار مورد نشان می‌دهد و دکمه‌ی «نمایش بیشتر» دارد و متن انگیزشی بزرگ‌تر شد.","جست‌وجوی سراسری فرمان‌ها را هم می‌فهمد؛ مثلاً «جلسه‌ی جدید» بنویسید تا فرم آن باز شود.","ابزارهای محاسبه‌ی حق‌الوکاله و تمبر همیشه باز و در انتهای صفحه‌ی «مالی» است.","دکمه‌ها زیباتر و فرم‌ها کوتاه‌تر شدند و دکمه‌های ثبت و انصراف در فرم‌های بلند پایین پنجره می‌مانند."],"1.17":["اقدام‌ها، جلسه‌ها، مهلت‌ها، ابلاغیه‌ها، اظهارنامه‌ها و مدارک هر پرونده به‌صورت کارت‌های کشویی درآمدند: عنوان و تاریخ در یک خط دیده می‌شود و با لمس هر کارت جزئیات و دکمه‌ها باز می‌شود. با نماد فلش و برچسب «جزئیات» معلوم است کارت بازشدنی است.","ابزارهای محاسبه‌ی حق‌الوکاله و تمبر همیشه باز و در انتهای صفحه‌ی «مالی» است.","دکمه‌های برنامه زیباتر شدند: حالت روی‌دکمه‌رفتن و فشردن، نماد برای ویرایش، حذف و افزودن، دکمه‌ی اصلی برجسته‌تر و دکمه‌ی حذف قرمز ملایم. دکمه‌های ثبت و انصراف در فرم‌های بلند همیشه پایین پنجره می‌مانند.","ابلاغیه‌ها و اظهارنامه‌ها حالا امکان پیوست فایل دارند.","در ثبت جلسه، «دادگاه یا مرجع رسیدگی» و «شعبه» دو فیلد جدا شدند.","تقویم انتخاب تاریخ فقط با لمس خود فیلد تاریخ باز می‌شود و دیگر هنگام باز شدن فرم خودبه‌خود ظاهر نمی‌شود.","«گزارش‌ها» به نوار پایین صفحه در گوشی آمد.","میز کار ساده‌تر شد: «کارهای امروز» داخل کارت اصلی میز کار آمد، دکمه‌های «یادآورها» و «گزارش موکل» برداشته شد، متن انگیزشی بزرگ‌تر شد و «پیش‌رو» چهار مورد نشان می‌دهد و دکمه‌ی «نمایش بیشتر» دارد.","ابزارهای محاسبه‌ی حق‌الوکاله و تمبر به انتهای صفحه‌ی «مالی» رفت و نماد تقویمِ بی‌کاربرد بالای صفحه حذف شد.","ظاهر تازه: رنگ‌ها، گوشه‌ها و سایه‌ها یکدست و آرام‌تر شد و حالت تاریک کامل‌تر است. از منوی بالا می‌توانید ظاهر را روی روشن، تاریک یا خودکار بگذارید.","نوار بالای صفحه سبک‌تر شد: فقط جست‌وجو، یادآورها، وضعیت پشتیبان و دکمه‌ی رنگی «منو» مانده است. بقیه‌ی گزینه‌ها (راهنما، اندازه‌ی نوشته، حریم خصوصی، بروزرسانی و…) زیر همان دکمه‌ی «منو» هستند.","در گوشی، تب‌های اصلی به نوار پایین صفحه آمدند تا با یک انگشت در دسترس باشند.","در صفحه‌ی هر پرونده، دکمه‌ی شناور «افزودن» برای ثبت سریع اقدام، جلسه، مهلت، ابلاغیه، اظهارنامه، مدرک و پرداخت اضافه شد. تب‌های پرونده در گوشی با لغزاندن جابه‌جا می‌شوند.","جست‌وجوی سراسری فرمان‌ها را هم می‌فهمد؛ مثلاً «جلسه‌ی جدید» بنویسید تا فرم آن باز شود.","داشبورد بخش «امروز» دارد و کارهای همین روز را جدا نشان می‌دهد.","فرم پرونده‌ی جدید و اقدام جدید کوتاه‌تر شد و بخش‌های اختیاری در یک قسمت بازشو جمع شده‌اند.","حالت‌های خالی دکمه‌ی ثبت اولین مورد دارند، پنجره‌ها نرم‌تر باز می‌شوند و دکمه‌ها برای لمس بزرگ‌تر شدند.","راهنمای شروع کار: یک راهنمای هشت‌مرحله‌ای با تصویر که اولین بار خودکار باز می‌شود و همیشه از دکمه‌ی «راهنما» در نوار بالا در دسترس است.","نماد برای هر بخش پرونده: اقدام‌ها، جلسه‌ها، مهلت‌ها، ابلاغیه‌ها، اظهارنامه‌ها، مدارک، خط زمانی و مالی هر کدام نماد خودشان را دارند و در خط زمانی هم دیده می‌شوند. اینک پیدا کردن هر بخش سریع‌تر است.","رمزگذاری فایل‌های پیوست: وقتی رمزگذاری اطلاعات روشن باشد، فایل‌های پیوست هم با همان گذرواژه رمز می‌شوند. فایل‌هایی که از قبل ثبت کرده‌اید هم هنگام روشن‌کردن رمزگذاری رمز می‌شوند.","رمزگذاری فایل پشتیبان: هنگام پشتیبان‌گیری می‌توانید فایل پشتیبان اصلی و پشتیبان فایل‌های پیوست را با یک گذرواژه‌ی جدا رمزگذاری کنید. بازگردانی هم با وارد کردن همان گذرواژه انجام می‌شود.","انتقال به دستگاه دیگر: همه‌ی پرونده‌ها و فایل‌های پیوست در یک بسته‌ی رمزگذاری‌شده قرار می‌گیرد تا آن را به دستگاه دیگر ببرید و بازگردانی کنید.","خط زمانی پرونده: اقدام‌ها، جلسه‌ها، مهلت‌ها، ابلاغیه‌ها، اظهارنامه‌ها، مدارک و ردیف‌های مالی هر پرونده به ترتیب تاریخ در یک نما دیده می‌شود. می‌توانید انواع را فیلتر کنید و ترتیب را عوض کنید.","اندازه‌ی نوشته: از دکمه‌ی «اندازه‌ی نوشته» (نماد A) در نوار بالای صفحه، اندازه‌ی متن و اجزای برنامه را بزرگ یا کوچک کنید.","قفل خودکار: اگر مدتی با برنامه کار نکنید، برنامه خودبه‌خود قفل می‌شود و دوباره گذرواژه می‌خواهد. مدت آن را در «حساب کاربری» تعیین می‌کنید.","نمای ماهانه‌ی تقویم: ماه شمسی یک‌جا دیده می‌شود و برای هر روز، تعداد جلسه‌ها و مهلت‌ها و نیز تعطیلی‌ها مشخص است.","یادآوری پشتیبان‌گیری: وقتی از آخرین فایل پشتیبان مدتی گذشته باشد، بالای صفحه یادآوری نشان داده می‌شود. فاصله‌ی یادآوری قابل تنظیم است.","محاسبه‌گر مهلت قانونی: با انتخاب نوع مهلت و تاریخ ابلاغ، موعد و روز هفته‌ی آن با در نظر گرفتن تعطیلات محاسبه می‌شود.","صفحه‌ی «مالی» در گوشی دیگر از کادر صفحه بیرون نمی‌زند."],"1.16":["ابلاغیه‌ها و اظهارنامه‌ها حالا امکان پیوست فایل دارند.","در ثبت جلسه، «دادگاه یا مرجع رسیدگی» و «شعبه» دو فیلد جدا شدند.","تقویم انتخاب تاریخ فقط با لمس خود فیلد تاریخ باز می‌شود و دیگر هنگام باز شدن فرم خودبه‌خود ظاه
