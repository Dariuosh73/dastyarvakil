name: Build and Release Signed Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Android app version, for example 1.0.1"
        required: true
        default: "1.0.1"

permissions:
  contents: write

jobs:
  build:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          repository: Dariuosh73/dastyarvakil
          ref: android-capacitor
          fetch-depth: 1

      - name: Verify project files
        run: |
          git rev-parse HEAD
          test -f package.json
          test -f scripts/prepare-web.mjs
          test -f scripts/patch-android.mjs
          test -f offline.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Patch Android project
        env:
          APP_VERSION: ${{ inputs.version }}
        run: node scripts/patch-android.mjs

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.p12"
          test -s "$RUNNER_TEMP/release-keystore.p12"

      - name: Validate signing keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -keystore "$RUNNER_TEMP/release-keystore.p12" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore validation successful."

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature and checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "dastyar-vakil-v$VERSION.apk"
          sha256sum "dastyar-vakil-v$VERSION.apk" | tee "dastyar-vakil-v$VERSION.apk.sha256"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-vakil-signed-release
          path: |
            dastyar-vakil-v${{ inputs.version }}.apk
            dastyar-vakil-v${{ inputs.version }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            "dastyar-vakil-v$VERSION.apk" \
            "dastyar-vakil-v$VERSION.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "دستیار وکیل — اندروید $VERSION" \
            --notes "نسخه‌ی اندروید $VERSION. فایل APK را دانلود و نصب کنید؛ اطلاعات شما حفظ می‌شود."
