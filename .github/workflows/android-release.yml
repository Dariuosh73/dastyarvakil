
name: Test Signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          repository: Dariuosh73/dastyarvakil
          ref: android-capacitor
          fetch-depth: 1

      - name: Verify project files
        run: |
          git rev-parse HEAD
          ls -la
          test -f package.json
          test -f scripts/prepare-web.mjs
          test -f icon-512.png

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android launcher icons from web icon
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("icon-512.png")
          if not source.is_file():
              raise SystemExit("icon-512.png was not found")

          res = Path("android/app/src/main/res")
          with Image.open(source) as image:
              icon = image.convert("RGBA").resize(
                  (512, 512), Image.Resampling.LANCZOS
              )

          for density, size in {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              resized = icon.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(folder / "ic_launcher.png", optimize=True)
              resized.save(folder / "ic_launcher_round.png", optimize=True)

          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          icon.resize((432, 432), Image.Resampling.LANCZOS).save(
              drawable / "ic_launcher_foreground.png", optimize=True
          )

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "dastyar_launcher_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '  <color name="dastyar_launcher_background">#101F38</color>\n'
              '</resources>\n',
              encoding="utf-8",
          )

          adaptive_dir = res / "mipmap-anydpi-v26"
          adaptive_dir.mkdir(parents=True, exist_ok=True)

          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/dastyar_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          """

          (adaptive_dir / "ic_launcher.xml").write_text(
              adaptive_xml, encoding="utf-8"
          )
          (adaptive_dir / "ic_launcher_round.xml").write_text(
              adaptive_xml, encoding="utf-8"
          )

          print("Android launcher icons generated successfully.")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.p12"
          test -s "$RUNNER_TEMP/release-keystore.p12"

      - name: Validate signing keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release-keystore.p12"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Keystore validation successful."

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Build signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature and checksum
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app-release.apk.sha256

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dastyar-vakil-signed-release-test
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
