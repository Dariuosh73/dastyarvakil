name: Test Signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
        with:
          repository: Dariuosh73/dastyarvakil
          ref: android-capacitor
          fetch-depth: 1

      - name: Verify project files
        run: |
          echo "Current branch:"
          git branch --show-current
          echo "Commit:"
          git rev-parse HEAD
          echo "Files:"
          ls -la
          test -f package.json
          echo "PACKAGE JSON FOUND"
          test -f scripts/prepare-web.mjs
          echo "prepare-web.mjs FOUND"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Add Android platform
